name: Inspecionar arquivos de arte
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspecionar-arte-oli.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python -m pip install -q pillow
      - name: Conferir imagem original do arquivo ZIP
        run: |
          python - <<'PY'
          import zipfile,re,base64,io
          from PIL import Image,ImageOps
          with zipfile.ZipFile('Site_GitHub_Pages_Cha_do_Oli.zip') as z:
            text=z.read('index.html').decode('utf-8','replace')
          m=re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)',text)
          img=Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert('RGBA')
          bg=Image.new('RGBA',img.size,'white');bg.alpha_composite(img)
          gray=ImageOps.grayscale(bg.convert('RGB')).resize((9,8),Image.Resampling.LANCZOS)
          p=list(gray.getdata())
          dh=sum(((p[y*9+x]>p[y*9+x+1])<<((y*8)+x)) for y in range(8) for x in range(8))
          reference=0xdb61311323273733
          print('ARCHIVE_SIZE',img.size,'bbox',img.getbbox())
          print('ARCHIVE_DHASH',f'{dh:016x}','distance',(dh^reference).bit_count())
          PY