name: Regenerar ícones do ursinho a partir da arte oficial
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install pillow
      - name: Gerar ícones a partir do PNG oficial sem alterar a home
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import base64
          source=Path('assets/urso-oli-home.png')
          original=Image.open(source).convert('RGBA')
          if original.width<1000 or original.height<1000:
            raise ValueError('A arte original deve estar em alta resolução')
          root=Path('icons')
          root.mkdir(exist_ok=True)
          def icon(size):
            canvas=Image.new('RGBA',(size,size),(0,0,0,0))
            img=ImageOps.contain(original,(size,size),Image.Resampling.LANCZOS)
            canvas.alpha_composite(img,((size-img.width)//2,(size-img.height)//2))
            return canvas
          for size in (48,192,512):
            icon(size).save(root/f'oli-{size}.png',optimize=True)
          background=Image.new('RGBA',(512,512),(247,238,224,255))
          img=ImageOps.contain(original,(350,350),Image.Resampling.LANCZOS)
          background.alpha_composite(img,((512-img.width)//2,(512-img.height)//2))
          background.save(root/'oli-maskable-512.png',optimize=True)
          badge=Image.new('RGBA',(96,96),'white')
          badge.putalpha(icon(96).getchannel('A'))
          badge.save(root/'oli-badge-96.png',optimize=True)
          data=base64.b64encode((root/'oli-48.png').read_bytes()).decode('ascii')
          Path('favicon.svg').write_text(
            '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><image x="0" y="0" width="64" height="64" href="data:image/png;base64,'+data+'"/></svg>',
            encoding='utf-8')
          PY
      - name: Commitar somente ícones, se houver alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/oli-48.png icons/oli-192.png icons/oli-512.png icons/oli-maskable-512.png icons/oli-badge-96.png favicon.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerar ícones a partir da arte oficial do Oli'
            git push
          fi
